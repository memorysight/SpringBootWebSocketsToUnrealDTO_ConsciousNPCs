spring.application.name=UnrealDTOConsciousNPC


server.address=0.0.0.0
server.port=8050

# H2 Database Configuration (in-memory)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:gamebackenddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=
#update # 'update' is good for dev, 'validate' or 'none' for prod
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging (optional, useful for debugging)
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# External API Keys (placeholders)
# You would inject these into your external clients
